# Desktop usershare host (ported from custom_distro samba-config).
# Included from smb.conf via a concrete path (Samba does not expand *.conf globs).
# Nautilus / "net usershare" folder shares; guest OK when the share allows it.

[global]
	obey pam restrictions = no
	map to guest = Bad User
	guest account = nobody
	usershare path = /var/lib/samba/usershares
	usershare allow guests = yes
	usershare max shares = 100

	# Skip slow reverse-DNS on client connections.
	hostname lookups = no
	dns proxy = no
	name resolve order = host bcast

	# Standalone file shares: no printer/WINS noise.
	load printers = no
	disable spoolss = yes
	browse list = no
	server min protocol = SMB2
	server multi channel support = no
	restrict anonymous = 0
