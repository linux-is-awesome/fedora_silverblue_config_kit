<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Ubuntu-like defaults on Fedora Atomic:

  - sans → Ubuntu / Ubuntu Sans (GNOME UI still uses gsettings font-name)
  - monospace → DejaVu Sans Mono first (same as Ubuntu fontconfig 60-latin.conf)
    GNOME apps that read monospace-font-name still use Ubuntu Sans Mono via gsettings
  - emoji → stock Noto Color Emoji
  - Do NOT append Symbola/emoji to every query (breaks UI icon fonts / chrome)
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Ubuntu Sans</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- Generic monospace: DejaVu first (as on Ubuntu when fonts-dejavu-mono is present). -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Ubuntu Sans Mono</family>
      <family>Ubuntu Mono</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Ubuntu Sans</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Ubuntu Sans</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Ubuntu Sans Mono</family>
      <family>Ubuntu Mono</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
